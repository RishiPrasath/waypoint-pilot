openapi: 3.1.0
info:
  title: Waypoint Partner Source API
  version: 1.0.0
  summary: Slice 1 contract for the mock partner logistics data source.
  description: |
    Partner Source exposes synthetic logistics data to Waypoint through a
    contract-first API. Slice 1 proves the core loop: a delivery agent retrieves
    assigned orders, creates a status event, and customer service reads the
    updated order status and timeline.
servers:
  - url: http://localhost:8080
    description: Local Spring Boot implementation
tags:
  - name: Auth
    description: Demo authentication for Slice 1 local implementations.
  - name: Orders
    description: Order status and timeline read operations.
  - name: Drivers
    description: Driver profile and assignment operations.
  - name: Status Events
    description: Delivery-agent status event writes.
  - name: Operations
    description: Service health and readiness checks.
paths:
  /api/v1/auth/demo-login:
    post:
      tags:
        - Auth
      operationId: demoLogin
      summary: Create a demo bearer token
      description: |
        Returns a deterministic Slice 1 demo token for a seeded driver or
        accepted customer-service identity. This is a local/demo login endpoint,
        not production authentication.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoLoginRequest"
            examples:
              driver:
                $ref: "#/components/examples/DemoDriverLoginRequest"
              customerService:
                $ref: "#/components/examples/DemoCsaLoginRequest"
      responses:
        "200":
          description: Demo token issued.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoLoginResponse"
              examples:
                driverToken:
                  $ref: "#/components/examples/DemoDriverLoginResponse"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "404":
          $ref: "#/components/responses/DriverNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/orders/{orderId}/status:
    get:
      tags:
        - Orders
      security:
        - bearerAuth: []
      operationId: getOrderStatus
      summary: Get current order status
      description: Returns the current customer-safe operational status for one order.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      responses:
        "200":
          description: Current order status returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderStatusResponse"
              examples:
                outForDelivery:
                  $ref: "#/components/examples/OrderStatusOutForDelivery"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/OrderNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/orders/{orderId}/timeline:
    get:
      tags:
        - Orders
      security:
        - bearerAuth: []
      operationId: getOrderTimeline
      summary: Get order timeline
      description: Returns chronological status events for one order.
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Order timeline returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderTimelineResponse"
              examples:
                timeline:
                  $ref: "#/components/examples/OrderTimeline"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/OrderNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/drivers/{driverId}:
    get:
      tags:
        - Drivers
      security:
        - bearerAuth: []
      operationId: getDriver
      summary: Get driver profile
      description: Returns a seeded driver profile for the driver frontend demo flow.
      parameters:
        - $ref: "#/components/parameters/DriverId"
      responses:
        "200":
          description: Driver profile returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverResponse"
              examples:
                activeDriver:
                  $ref: "#/components/examples/Driver"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/DriverNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/drivers/{driverId}/assignments:
    get:
      tags:
        - Drivers
      security:
        - bearerAuth: []
      operationId: listDriverAssignments
      summary: List driver assignments
      description: Returns orders assigned to one driver, including lightweight delivery details.
      parameters:
        - $ref: "#/components/parameters/DriverId"
        - name: status
          in: query
          required: false
          description: Optional order status filter.
          schema:
            $ref: "#/components/schemas/OrderStatus"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Driver assignments returned.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriverAssignmentsResponse"
              examples:
                assignments:
                  $ref: "#/components/examples/DriverAssignments"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          $ref: "#/components/responses/AccessDenied"
        "404":
          $ref: "#/components/responses/DriverNotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /api/v1/orders/{orderId}/status-events:
    post:
      tags:
        - Status Events
      security:
        - bearerAuth: []
      operationId: createOrderStatusEvent
      summary: Create order status event
      description: |
        Creates a delivery status event for an order. The service must validate
        that the order exists, the driver exists, the driver is assigned to the
        order, and the requested transition is allowed.
      parameters:
        - $ref: "#/components/parameters/OrderId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateStatusEventRequest"
            examples:
              delivered:
                $ref: "#/components/examples/CreateDeliveredStatusEvent"
      responses:
        "201":
          description: Status event created and order current status updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StatusEventResponse"
              examples:
                delivered:
                  $ref: "#/components/examples/DeliveredStatusEvent"
        "400":
          $ref: "#/components/responses/InvalidRequest"
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Caller is not allowed to create this status event, or the driver is not assigned to this order.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                accessDenied:
                  $ref: "#/components/examples/AccessDeniedProblem"
                notAssigned:
                  $ref: "#/components/examples/OrderNotAssignedProblem"
        "404":
          description: Order or driver was not found.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetail"
              examples:
                orderNotFound:
                  $ref: "#/components/examples/OrderNotFoundProblem"
                driverNotFound:
                  $ref: "#/components/examples/DriverNotFoundProblem"
        "409":
          $ref: "#/components/responses/InvalidStatusTransition"
        "422":
          $ref: "#/components/responses/InvalidStatusEvent"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /health:
    get:
      tags:
        - Operations
      operationId: getHealth
      summary: Health check
      description: Confirms the service process is alive.
      responses:
        "200":
          description: Service is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
              examples:
                up:
                  $ref: "#/components/examples/HealthUp"

  /ready:
    get:
      tags:
        - Operations
      operationId: getReadiness
      summary: Readiness check
      description: Confirms the service is ready to handle API requests.
      responses:
        "200":
          description: Service is ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
              examples:
                ready:
                  $ref: "#/components/examples/Ready"
        "503":
          description: Service is not ready.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
              examples:
                notReady:
                  $ref: "#/components/examples/NotReady"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: DemoToken

  parameters:
    OrderId:
      name: orderId
      in: path
      required: true
      description: Stable synthetic order ID.
      schema:
        type: string
        pattern: "^ORD-[0-9]{4}$"
        example: ORD-1001
    DriverId:
      name: driverId
      in: path
      required: true
      description: Stable synthetic driver ID.
      schema:
        type: string
        pattern: "^DRV-[0-9]{4}$"
        example: DRV-2001
    Page:
      name: page
      in: query
      required: false
      description: One-based page number.
      schema:
        type: integer
        minimum: 1
        default: 1
        example: 1
    PageSize:
      name: pageSize
      in: query
      required: false
      description: Number of items to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
        example: 20

  responses:
    Unauthenticated:
      description: Bearer token is missing or invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          examples:
            unauthenticated:
              $ref: "#/components/examples/UnauthenticatedProblem"
    AccessDenied:
      description: Authenticated principal is not allowed to access this resource or action.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          examples:
            accessDenied:
              $ref: "#/components/examples/AccessDeniedProblem"
    InvalidRequest:
      description: Request syntax, path parameter, or query parameter is invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          examples:
            invalidRequest:
              $ref: "#/components/examples/InvalidRequestProblem"
    OrderNotFound:
      description: Order was not found.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          examples:
            orderNotFound:
              $ref: "#/components/examples/OrderNotFoundProblem"
    DriverNotFound:
      description: Driver was not found.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          examples:
            driverNotFound:
              $ref: "#/components/examples/DriverNotFoundProblem"
    OrderNotAssignedToDriver:
      description: Driver is not allowed to update this order.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          examples:
            notAssigned:
              $ref: "#/components/examples/OrderNotAssignedProblem"
    InvalidStatusTransition:
      description: Requested status transition is not allowed.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          examples:
            invalidTransition:
              $ref: "#/components/examples/InvalidStatusTransitionProblem"
    InvalidStatusEvent:
      description: Status event is semantically invalid.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          examples:
            invalidStatusEvent:
              $ref: "#/components/examples/InvalidStatusEventProblem"
    InternalServerError:
      description: Unexpected server failure.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
          examples:
            internalServerError:
              $ref: "#/components/examples/InternalServerErrorProblem"

  schemas:
    DemoLoginRequest:
      type: object
      required:
        - actorType
        - actorId
      properties:
        actorType:
          type: string
          enum:
            - DRIVER
            - USER
          example: DRIVER
        actorId:
          type: string
          example: DRV-2001
      additionalProperties: false

    DemoLoginResponse:
      type: object
      required:
        - accessToken
        - tokenType
        - expiresIn
        - principal
      properties:
        accessToken:
          type: string
          example: demo-driver-2001-token
        tokenType:
          type: string
          enum:
            - Bearer
          example: Bearer
        expiresIn:
          type: integer
          minimum: 1
          example: 3600
        principal:
          $ref: "#/components/schemas/AuthenticatedPrincipal"
      additionalProperties: false

    AuthenticatedPrincipal:
      type: object
      required:
        - subject
        - role
        - actorType
        - actorId
        - scopes
        - demoOrgId
        - channel
      properties:
        subject:
          type: string
          example: driver:DRV-2001
        role:
          type: string
          enum:
            - DELIVERY_DRIVER
            - CUSTOMER_SERVICE_AGENT
          example: DELIVERY_DRIVER
        actorType:
          type: string
          enum:
            - DRIVER
            - USER
          example: DRIVER
        actorId:
          type: string
          example: DRV-2001
        scopes:
          type: array
          items:
            type: string
          example:
            - orders:read:assigned
            - status-events:create
        demoOrgId:
          type: string
          example: demo-org-1
        channel:
          type: string
          example: driver-app
      additionalProperties: false

    OrderStatus:
      type: string
      enum:
        - CREATED
        - CONFIRMED
        - PICKED_UP
        - IN_TRANSIT
        - OUT_FOR_DELIVERY
        - DELIVERY_ATTEMPTED
        - DELIVERED
        - CANCELLED

    AssignmentStatus:
      type: string
      enum:
        - ASSIGNED
        - ACCEPTED
        - COMPLETED
        - CANCELLED

    ActorType:
      type: string
      enum:
        - SYSTEM
        - DRIVER
        - SUPPORT_AGENT

    DriverAvailabilityStatus:
      type: string
      enum:
        - AVAILABLE
        - UNAVAILABLE
        - OFFLINE

    DeliveryWindow:
      type: object
      required:
        - start
        - end
      properties:
        start:
          type: string
          format: date-time
          example: "2026-06-30T14:00:00+08:00"
        end:
          type: string
          format: date-time
          example: "2026-06-30T18:00:00+08:00"
      additionalProperties: false

    LocationSnapshot:
      type:
        - object
        - "null"
      required:
        - label
        - capturedAt
      properties:
        label:
          type: string
          minLength: 1
          maxLength: 120
          example: Tampines Delivery Hub
        latitude:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: 1.3521
        longitude:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: 103.9448
        capturedAt:
          type: string
          format: date-time
          example: "2026-06-30T10:15:00+08:00"
      additionalProperties: false

    AssignedDriverSummary:
      type:
        - object
        - "null"
      required:
        - driverId
        - displayName
      properties:
        driverId:
          type: string
          pattern: "^DRV-[0-9]{4}$"
          example: DRV-2001
        displayName:
          type: string
          minLength: 1
          maxLength: 120
          example: A. Kumar
      additionalProperties: false

    OrderStatusResponse:
      type: object
      required:
        - orderId
        - currentStatus
        - statusLabel
        - estimatedDeliveryAt
        - deliveryWindow
        - lastUpdatedAt
      properties:
        orderId:
          type: string
          pattern: "^ORD-[0-9]{4}$"
          example: ORD-1001
        currentStatus:
          $ref: "#/components/schemas/OrderStatus"
        statusLabel:
          type: string
          example: Out for delivery
        currentLocation:
          $ref: "#/components/schemas/LocationSnapshot"
        estimatedDeliveryAt:
          type:
            - string
            - "null"
          format: date-time
          example: "2026-06-30T18:00:00+08:00"
        deliveryWindow:
          $ref: "#/components/schemas/DeliveryWindow"
        assignedDriver:
          $ref: "#/components/schemas/AssignedDriverSummary"
        lastUpdatedAt:
          type: string
          format: date-time
          example: "2026-06-30T10:15:00+08:00"
      additionalProperties: false

    OrderTimelineResponse:
      type: object
      required:
        - orderId
        - items
        - page
        - pageSize
        - totalItems
      properties:
        orderId:
          type: string
          pattern: "^ORD-[0-9]{4}$"
          example: ORD-1001
        items:
          type: array
          items:
            $ref: "#/components/schemas/TimelineEvent"
        page:
          type: integer
          minimum: 1
          example: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        totalItems:
          type: integer
          minimum: 0
          example: 2
      additionalProperties: false

    TimelineEvent:
      type: object
      required:
        - eventId
        - status
        - statusLabel
        - occurredAt
        - actorType
        - actorId
      properties:
        eventId:
          type: string
          pattern: "^EVT-[0-9]{4}$"
          example: EVT-4001
        status:
          $ref: "#/components/schemas/OrderStatus"
        statusLabel:
          type: string
          example: Out for delivery
        occurredAt:
          type: string
          format: date-time
          example: "2026-06-30T10:15:00+08:00"
        actorType:
          $ref: "#/components/schemas/ActorType"
        actorId:
          type: string
          example: DRV-2001
        location:
          $ref: "#/components/schemas/LocationSnapshot"
        note:
          type:
            - string
            - "null"
          maxLength: 500
          example: Loaded onto delivery vehicle
      additionalProperties: false

    DriverResponse:
      type: object
      required:
        - driverId
        - displayName
        - availabilityStatus
        - activeAssignmentCount
      properties:
        driverId:
          type: string
          pattern: "^DRV-[0-9]{4}$"
          example: DRV-2001
        displayName:
          type: string
          minLength: 1
          maxLength: 120
          example: A. Kumar
        availabilityStatus:
          $ref: "#/components/schemas/DriverAvailabilityStatus"
        activeAssignmentCount:
          type: integer
          minimum: 0
          example: 3
      additionalProperties: false

    DriverAssignmentsResponse:
      type: object
      required:
        - driverId
        - items
        - page
        - pageSize
        - totalItems
      properties:
        driverId:
          type: string
          pattern: "^DRV-[0-9]{4}$"
          example: DRV-2001
        items:
          type: array
          items:
            $ref: "#/components/schemas/DriverAssignmentItem"
        page:
          type: integer
          minimum: 1
          example: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          example: 20
        totalItems:
          type: integer
          minimum: 0
          example: 1
      additionalProperties: false

    DriverAssignmentItem:
      type: object
      required:
        - assignmentId
        - orderId
        - assignmentStatus
        - currentStatus
        - recipientName
        - deliveryAddressSummary
        - deliveryWindow
        - lastUpdatedAt
      properties:
        assignmentId:
          type: string
          pattern: "^ASN-[0-9]{4}$"
          example: ASN-3001
        orderId:
          type: string
          pattern: "^ORD-[0-9]{4}$"
          example: ORD-1001
        assignmentStatus:
          $ref: "#/components/schemas/AssignmentStatus"
        currentStatus:
          $ref: "#/components/schemas/OrderStatus"
        recipientName:
          type: string
          minLength: 1
          maxLength: 120
          example: Jamie Tan
        deliveryAddressSummary:
          type: string
          minLength: 1
          maxLength: 240
          example: Tampines, Singapore
        deliveryWindow:
          $ref: "#/components/schemas/DeliveryWindow"
        lastUpdatedAt:
          type: string
          format: date-time
          example: "2026-06-30T10:15:00+08:00"
      additionalProperties: false

    CreateStatusEventRequest:
      type: object
      required:
        - driverId
        - status
      properties:
        driverId:
          type: string
          pattern: "^DRV-[0-9]{4}$"
          example: DRV-2001
        status:
          $ref: "#/components/schemas/OrderStatus"
        occurredAt:
          type: string
          format: date-time
          example: "2026-06-30T15:45:00+08:00"
        location:
          $ref: "#/components/schemas/LocationSnapshot"
        note:
          type: string
          maxLength: 500
          example: Left with reception
        proofOfDeliveryAvailable:
          type: boolean
          example: true
      additionalProperties: false

    StatusEventResponse:
      type: object
      required:
        - eventId
        - orderId
        - previousStatus
        - newStatus
        - statusLabel
        - occurredAt
        - actorType
        - actorId
        - orderCurrentStatus
      properties:
        eventId:
          type: string
          pattern: "^EVT-[0-9]{4}$"
          example: EVT-4003
        orderId:
          type: string
          pattern: "^ORD-[0-9]{4}$"
          example: ORD-1001
        previousStatus:
          $ref: "#/components/schemas/OrderStatus"
        newStatus:
          $ref: "#/components/schemas/OrderStatus"
        statusLabel:
          type: string
          example: Delivered
        occurredAt:
          type: string
          format: date-time
          example: "2026-06-30T15:45:00+08:00"
        actorType:
          $ref: "#/components/schemas/ActorType"
        actorId:
          type: string
          example: DRV-2001
        location:
          $ref: "#/components/schemas/LocationSnapshot"
        note:
          type:
            - string
            - "null"
          maxLength: 500
          example: Left with reception
        proofOfDeliveryAvailable:
          type: boolean
          example: true
        orderCurrentStatus:
          $ref: "#/components/schemas/OrderStatus"
      additionalProperties: false

    HealthResponse:
      type: object
      required:
        - status
        - service
      properties:
        status:
          type: string
          enum:
            - UP
          example: UP
        service:
          type: string
          example: partner-source
      additionalProperties: false

    ReadinessResponse:
      type: object
      required:
        - status
        - service
        - checks
      properties:
        status:
          type: string
          enum:
            - READY
            - NOT_READY
          example: READY
        service:
          type: string
          example: partner-source
        checks:
          type: object
          required:
            - persistence
            - seedData
          properties:
            persistence:
              type: string
              enum:
                - UP
                - DOWN
              example: UP
            seedData:
              type: string
              enum:
                - UP
                - DOWN
              example: UP
          additionalProperties: false
      additionalProperties: false

    ProblemDetail:
      type: object
      required:
        - type
        - title
        - status
        - detail
        - instance
        - errorCode
        - correlationId
      properties:
        type:
          type: string
          format: uri
          example: https://waypoint.local/problems/order-not-found
        title:
          type: string
          example: Order not found
        status:
          type: integer
          minimum: 400
          maximum: 599
          example: 404
        detail:
          type: string
          example: No order exists for orderId ORD-9999.
        instance:
          type: string
          example: /api/v1/orders/ORD-9999/status
        errorCode:
          type: string
          enum:
            - UNAUTHENTICATED
            - ACCESS_DENIED
            - INVALID_REQUEST
            - ORDER_NOT_FOUND
            - DRIVER_NOT_FOUND
            - ASSIGNMENT_NOT_FOUND
            - ORDER_NOT_ASSIGNED_TO_DRIVER
            - INVALID_STATUS_TRANSITION
            - INVALID_STATUS_EVENT
            - INTERNAL_SERVER_ERROR
          example: ORDER_NOT_FOUND
        correlationId:
          type: string
          example: req-123
      additionalProperties: false

  examples:
    DemoDriverLoginRequest:
      value:
        actorType: DRIVER
        actorId: DRV-2001

    DemoCsaLoginRequest:
      value:
        actorType: USER
        actorId: CSA-5001

    DemoDriverLoginResponse:
      value:
        accessToken: demo-driver-2001-token
        tokenType: Bearer
        expiresIn: 3600
        principal:
          subject: driver:DRV-2001
          role: DELIVERY_DRIVER
          actorType: DRIVER
          actorId: DRV-2001
          scopes:
            - orders:read:assigned
            - status-events:create
          demoOrgId: demo-org-1
          channel: driver-app

    OrderStatusOutForDelivery:
      value:
        orderId: ORD-1001
