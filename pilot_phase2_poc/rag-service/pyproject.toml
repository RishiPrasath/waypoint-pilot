[project]
name = "rag-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "pydantic",
  "pydantic-settings",
  "uvicorn",
]

[dependency-groups]
dev = [
  "bandit",
  "httpx2",
  "pip-audit",
  "pytest",
  "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.bandit]
exclude_dirs = [
  "app/api/tests",
  "app/core/tests",
  "app/shared/tests",
  "app/shared/vector_db/tests",
]
