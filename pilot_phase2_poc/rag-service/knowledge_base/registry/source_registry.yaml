registry_metadata:
  task_id: RAG-DT003
  title: APAC source candidate registry
  status: draft
  created_on: "2026-07-16"
  verified_on: "2026-07-16"
  schema: source_registry.schema.json
  first_pass_markets:
    - SG
    - MY
    - ID
    - TH
    - VN
    - PH
    - ASEAN
    - Global
  default_retrieval_policy: All RAG-DT003 records are candidates and remain retrieval_eligible false until later source review and KB materialization tasks approve promotion.
  excluded_source_classes:
    - live shipment status
    - order status
    - carrier assignment
    - ETA and delivery event feeds
    - authenticated transaction systems
  notes: Carrier sources are intentionally excluded from this APAC registry pass unless a later approved static carrier-reference use case requires them.

source_groups:
  - group_id: sg_customs
    jurisdictions:
      - SG
    source_owner: Singapore Customs and Singapore legal authority portals
    review_focus: import/export permits, TradeNet, controlled goods, rules of origin, primary legislation
  - group_id: my_customs
    jurisdictions:
      - MY
    source_owner: Royal Malaysian Customs Department and MITI
    review_focus: import/export procedures, MNTR, tariff lookup, strategic trade, rules of origin
  - group_id: id_customs
    jurisdictions:
      - ID
    source_owner: Directorate General of Customs and Excise, INSW, and JDIH Kemenkeu
    review_focus: import/export procedure, BTKI, restrictions, INTR, legal instruments
  - group_id: th_vn_ph_customs
    jurisdictions:
      - TH
      - VN
      - PH
    source_owner: national customs, national trade repository, and tariff authority portals
    review_focus: customs procedures, legal indexes, tariff references, trade repositories
  - group_id: asean_global_reference
    jurisdictions:
      - ASEAN
      - Global
    source_owner: ASEAN Secretariat, WCO, WTO, UN/CEFACT, ICC
    review_focus: regional agreements, rules of origin, tariff tools, HS classification, Incoterms licensing

